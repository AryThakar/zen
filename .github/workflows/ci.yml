name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The model weights and native speech libraries are not in the repository, so CI covers
# everything that does not need them: the Rust build, unit and flow tests, lints, and the
# interface tests. Tests that need a model skip themselves when it is absent. The real
# end-to-end check is `zen.exe --self-test` on a machine with the assets installed.
jobs:
  rust:
    name: Rust build, test and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the release the code and its clippy lints are verified with. Tracking
      # `stable` lets a new Rust release add lints that fail an unchanged commit; moving to a
      # newer toolchain is a deliberate change, made here and fixed in the same commit.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --release --locked --all-targets

  interface:
    name: Interface tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # The UI tests drive the runner's installed Microsoft Edge (tests/ui.test.cjs), so no
      # Playwright browser download is needed.
      - name: UI tests
        run: npm run test:ui
